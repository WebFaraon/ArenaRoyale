# Temporary HTTP configuration used while obtaining the first IP certificate.
# The Node process listens on 127.0.0.1:3000 (PORT=3000 in PM2).
map $http_upgrade $blastridge_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 79.108.166.122;
    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/blastridge-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $blastridge_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
