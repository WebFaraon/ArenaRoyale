# Production TLS endpoint for the publicly trusted Let's Encrypt IP certificate.
# Certbot renews this short-lived certificate and reloads nginx via a deploy hook.
map $http_upgrade $blastridge_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 79.108.166.122;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/blastridge-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 79.108.166.122;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/79.108.166.122/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/79.108.166.122/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $blastridge_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
