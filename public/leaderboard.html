    <style>
        body { overflow-y: auto; overflow-x: hidden; height: auto; min-height: 100dvh; user-select: text; -webkit-user-select: text; }

        .lbp-header {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 60px;
            padding: var(--safe-t) max(var(--gx), var(--safe-r)) 0 max(var(--gx), var(--safe-l));
            background: var(--board);
            border-bottom: 1px solid var(--rule);
        }
        .lbp-header::after { content: ''; position: absolute; left: max(var(--gx), var(--safe-l)); bottom: -1px; width: 96px; height: 3px; background: var(--start); }
        .lbp-back { display: inline-flex; align-items: center; gap: .5em; min-height: 40px; padding: 0 14px 0 10px; border: 1px solid var(--rule); border-radius: var(--r); color: var(--chalk-2); font-weight: 800; font-size: .8rem; letter-spacing: .09em; text-decoration: none; transition: background-color .15s var(--ease-out), color .15s var(--ease-out); }
        @media (hover: hover) and (pointer: fine) { .lbp-back:hover { background: var(--board-up); color: var(--chalk); } }
        .lbp-back:active { background: var(--board-up); transform: translateY(1px); }
        .lbp-title-wrap { flex: 1; min-width: 0; }
        .lbp-title { display: flex; align-items: center; gap: .5em; font-weight: 800; font-size: clamp(1.1rem, 3vw, 1.5rem); letter-spacing: .04em; text-transform: uppercase; line-height: 1; }
        .lbp-title .ic { color: var(--gold); width: 1.1em; height: 1.1em; }
        .lbp-sub { margin-top: 3px; color: var(--chalk-3); font-size: .78rem; font-weight: 600; }
        .lbp-live { display: inline-flex; align-items: center; gap: 8px; color: var(--lane); font-weight: 800; font-size: .75rem; letter-spacing: .14em; }
        .lbp-live i { width: 8px; height: 8px; background: var(--lane); animation: tick 1.6s steps(1) infinite; }

        .lbp-wrap { max-width: 860px; margin: 0 auto; padding: clamp(14px, 3vh, 32px) max(var(--gx), var(--safe-l)) calc(var(--safe-b) + 24px); }
        .lbp-table { width: 100%; border-collapse: collapse; border: 1px solid var(--rule); background: var(--board); }
        .lbp-table thead th { padding: 14px 12px; border-bottom: 1px solid var(--rule-hi); color: var(--chalk-3); font-weight: 800; font-size: .72rem; letter-spacing: .12em; text-align: left; }
        .lbp-table thead th.center { text-align: center; }
        .lbp-table tbody tr { border-bottom: 1px solid var(--rule); animation: laneIn .4s var(--ease-out) backwards; animation-delay: calc(var(--r, 0) * 30ms); }
        @media (hover: hover) and (pointer: fine) { .lbp-table tbody tr:hover { background: var(--board-hi); } }
        .lbp-table td { padding: 12px; font-size: .95rem; font-variant-numeric: tabular-nums; }
        .lbp-table td.rank { width: 64px; text-align: center; }
        .lbp-table td.name { font-weight: 800; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lbp-table td.wins  { color: var(--gold); font-weight: 800; text-align: center; }
        .lbp-table td.kills { text-align: center; font-weight: 700; }
        .lbp-table td.games { color: var(--chalk-3); text-align: center; }
        .lbp-table td.krate { color: var(--lane); font-weight: 800; text-align: center; }
        .lbp-status { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 56px 20px; color: var(--chalk-3); font-size: .95rem; text-align: center; line-height: 1.5; }
        .lbp-status .ic { width: 2rem; height: 2rem; stroke-width: 1.75; }
        @media (max-width: 520px) {
            .lbp-sub { display: none; }
            .lbp-table td, .lbp-table thead th { padding: 10px 8px; }
            .lbp-table td.games, .lbp-table thead th:nth-child(5) { display: none; }
        }
    </style>
</head>

    <header class="lbp-header">
            <a href="/" class="lbp-back" onclick="history.back(); return false;"><svg class="ic" aria-hidden="true"><use href="#chevron-left"/></svg>BACK</a>
        <div class="lbp-title-wrap">
            <h1 class="lbp-title"><svg class="ic" aria-hidden="true"><use href="#trophy"/></svg>Leaderboard</h1>
            <p class="lbp-sub">Top Blastridge players</p>
        </div>
        <div class="lbp-live"><i></i>LIVE</div>
    </header>

    <main class="lbp-wrap">
        <table class="lbp-table">
            <thead>
                <tr>
                    <th class="center">#</th>
                    <th>NICKNAME</th>
                    <th class="center">WINS</th>
                    <th class="center">KILLS</th>
                    <th class="center">MATCHES</th>
                    <th class="center">K/MATCH</th>
                </tr>
            </thead>
            <tbody id="lb-body"></tbody>
        </table>
        <div class="lbp-status" id="lb-status">
            <svg class="ic" aria-hidden="true"><use href="#loader"/></svg>
            <div>Loading...</div>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const tbody   = document.getElementById('lb-body');
        const status  = document.getElementById('lb-status');
        const icon = (n) => '<svg class="ic" aria-hidden="true"><use href="#' + n + '"/></svg>';

        function renderLeaderboard(data) {
            if (!data || data.length === 0) {
                tbody.innerHTML = '';
                status.innerHTML = icon('gamepad-2') + '<div>No players yet.<br>Be the first!</div>';
                status.style.display = 'flex';
                return;
            }
            status.style.display = 'none';
            tbody.innerHTML = data.map((p, i) => {
                const kRate   = p.games_played > 0
                    ? (p.kills_total / p.games_played).toFixed(1)
                    : '0.0';
                const rankStr = '<span class="rk' + (i < 3 ? ' rk-' + (i + 1) : '') + '">' + (i + 1) + '</span>';
                return `<tr style="--r:${i}">
                    <td class="rank">${rankStr}</td>
                    <td class="name">${escHtml(p.nickname)}</td>
                    <td class="wins">${p.wins_total   || 0}</td>
                    <td class="kills">${p.kills_total || 0}</td>
                    <td class="games">${p.games_played || 0}</td>
                    <td class="krate">${kRate}</td>
                </tr>`;
            }).join('');
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        async function loadLeaderboard() {
            try {
                const res  = await fetch('/api/leaderboard');
                const data = await res.json();
                renderLeaderboard(data);
            } catch {
                status.innerHTML = icon('triangle-alert') + '<div>Could not load the leaderboard. Reload the page.</div>';
                status.style.display = 'flex';
            }
        }

        // Real-time via Socket.IO
        const socket = io();
        socket.on('leaderboard-update', renderLeaderboard);

        loadLeaderboard();
        // Fallback refresh if Socket.IO disconnects
        setInterval(loadLeaderboard, 30000);
    </script>
